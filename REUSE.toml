version = 1

SPDX-PackageName = "proxy-smart"
SPDX-PackageSupplier = "Max Health Inc. <hello@maxhealth.tech>"
SPDX-PackageDownloadLocation = "https://github.com/proxy-smart/proxy-smart"

# Catch-all: every first-party file is dual-licensed (AGPL-3.0-or-later OR a
# commercial license). precedence = "aggregate" means a per-file SPDX header,
# when present, is honored on top of this default rather than overridden, so we
# can add real per-file headers incrementally without ever breaking `reuse lint`.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Max Health Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later OR LicenseRef-Commercial"

# NOTE: the vendored-tarball annotation (LicenseRef-VendoredThirdParty) was
# removed when the IGs moved to published packages and lib/*.tgz became a
# gitignored build artifact. `reuse lint` fails on a license text nothing
# references, so the LICENSES/ entry had to go with it. If a third-party
# artifact is ever committed again, restore both together.

# Generated API clients are build output derived from our OpenAPI spec; they
# inherit the project license but hold no separate copyright of their own.
[[annotations]]
path = ["packages/patient-picker/src/lib/api-client.ts"]
precedence = "override"
SPDX-FileCopyrightText = "Max Health Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later OR LicenseRef-Commercial"
