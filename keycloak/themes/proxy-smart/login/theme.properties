parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/brand.css css/idp-icons.css

# Per-organization accent. The base login template renders `scripts` into <head> without
# defer, so this runs before paint and can add its stylesheet as a render-blocking <link>
# (see resources/js/proxy-context.js).
#
# Keycloak substitutes ${env.X} here, which is how the backend origin reaches a theme that
# is otherwise static files. It is needed because Keycloak and the backend are on different
# hosts in production (auth.* vs api.*). Set PROXY_PUBLIC_URL on the Keycloak container;
# with it unset Keycloak emits this placeholder verbatim, and proxy-context.js ignores any
# base that is not an absolute http(s) URL and falls back to same-origin.
scripts=js/proxy-context.js?base=${env.PROXY_PUBLIC_URL}

# Proxy origin for "Back to application" on the error page when Keycloak no longer knows the
# client (an expired auth session, a failure inside the identity broker). error.ftl links to
# its /auth/return, and proxy-context.js adds the client_id it remembered from the login page.
backToApplicationUrl=${env.PROXY_PUBLIC_URL}
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
