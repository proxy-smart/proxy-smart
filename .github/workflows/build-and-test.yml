name: Build & Test

on:
  push:
    branches:
      - "dev/*"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      run_tests:
        description: "Whether to run tests"
        required: false
        type: boolean
        default: true
      fail_on_test_failure:
        description: "Whether to fail the workflow if tests fail"
        required: false
        type: boolean
        default: true
    outputs:
      backend_success:
        description: "Whether backend build was successful"
        value: ${{ jobs.build-and-test.outputs.backend_success }}
      backend_tests_success:
        description: "Whether backend tests were successful"
        value: ${{ jobs.build-and-test.outputs.backend_tests_success }}

permissions:
  contents: read
  # Needed so bun can install @max-health-inc/shared-ui from GitHub Packages.
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. a `bun install` waiting on registry/git auth)
    # fails fast instead of running to GitHub's 6h default.
    timeout-minutes: 40
    outputs:
      backend_success: ${{ steps.backend-build.outcome == 'success' }}
      backend_tests_success: ${{ steps.backend-test.outcome == 'success' || (inputs.run_tests != true && inputs.run_tests != null) }}

    # A disposable Postgres for the shared-state tests (TEST_DATABASE_URL below).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proxy_smart
          POSTGRES_PASSWORD: proxy_smart
          POSTGRES_DB: proxy_smart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
    # The admin UI is a separate private repository in the proxy-smart org; the
    # default GITHUB_TOKEN cannot reach it, so the checkout below uses an app token
    # minted for that org — the same mechanism deploy-beta uses for its checkouts.
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: proxy-smart
        repositories: proxy-smart-admin-ui

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: ./.github/actions/setup-bun-version

    # Install Dependencies
    - name: Install Dependencies (Workspace)
      timeout-minutes: 20
      uses: ./.github/actions/bun-install
      with:
        token: ${{ secrets.GH_PACKAGES_TOKEN }}

    # === BACKEND BUILD ===
    - name: Build Backend
      id: backend-build
      run: |
        echo "🔨 Building backend..."
        cd backend
        bun run build
    
    - name: Generate Client APIs
      run: |
        echo "🔨 Generating client APIs..."
        pip install --break-system-packages openapi-ts-fetch==0.3.0
        # `generate` covers every generated client: the shared
        # @proxy-smart/api-client package (which the admin UI
        # consumes) and the CLI's tag-filtered copy. Both are gitignored, so
        # anything not generated here does not exist in CI at all — the CLI used
        # to be silently absent. The package is compiled, not just emitted, so
        # the UI typecheck resolves it through dist/.
        bun run generate

    # === FRONTEND ===
    # The admin UI is proxy-smart/proxy-smart-admin-ui now. It is built and
    # tested against the client this commit produces, so a route change that
    # breaks the UI still fails here rather than at deploy time.
    # An API rename lands as a pair: this branch here and a same-named branch in the
    # admin UI. Build that branch when it exists, otherwise main.
    - name: Resolve admin UI ref
      id: admin-ui-ref
      uses: ./.github/actions/admin-ui-ref
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Checkout admin UI
      uses: actions/checkout@v6
      with:
        repository: proxy-smart/proxy-smart-admin-ui
        ref: ${{ steps.admin-ui-ref.outputs.ref }}
        path: admin-ui
        token: ${{ steps.app-token.outputs.token }}

    - name: Build Frontend
      env:
        GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        TAILWIND_DISABLE_LIGHTNINGCSS: "1"
        VITE_ENCRYPTION_SECRET: ${{ secrets.VITE_ENCRYPTION_SECRET }}
      run: |
        echo "🔨 Building admin UI against this commit's client..."
        cd admin-ui
        bun add "@proxy-smart/api-client@file:../packages/api-client"
        bun run build

    # === BACKEND TESTS ===
    - name: Test Backend
      id: backend-test
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      env:
        TEST_DATABASE_URL: postgresql://proxy_smart:proxy_smart@localhost:5432/proxy_smart_test
      run: |
        echo "🧪 Testing backend..."
        cd backend
        # `bun run test` uses `bun test --isolate` (see package.json). --isolate
        # gives each test file a fresh global object, so mock.module() (which is
        # process-global and is NOT undone by mock.restore()) can't leak between
        # files. Without it, a file mocking a shared module (e.g. @/lib/auth)
        # leaked into files testing the real one — order-dependent, so it passed
        # locally but failed in CI (Linux readdir order). See bun docs: mocks.
        bun run lint
        bun run test

    # === FRONTEND TESTS ===
    - name: Test Frontend
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      env:
        GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        TAILWIND_DISABLE_LIGHTNINGCSS: "1"
      run: |
        echo "🧪 Testing admin UI..."
        cd admin-ui
        bun run test --run

    # === Shared packages ===
    # Every packages/* workspace with the script, so a new package is covered without editing this step.
    - name: Test Shared Packages
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      run: |
        echo "🧪 Testing shared packages..."
        bun run typecheck:packages
        bun run lint:packages
        bun run test:packages

    # === Docs ===
    # Badges and in-repo links rot without ever failing a build: a version badge
    # advertising an old release, a workflow badge pointing at a renamed file, a
    # nav link outliving its heading. Static only, so no network flake.
    - name: Check Badges and Doc Links
      run: bun run check:badges

    - name: Check Bun Version Consistency
      run: bun run check:bun-version

    - name: Check Login Theme Environment
      run: bun run check:theme-env

    # proxy-smart.guido.json is the configuration contract: the backend's env reads, the docs,
    # .env.example and every compose file are checked against it.
    - name: Check Configuration Contract
      run: bun run check:config

    # Fenced ts/tsx examples are compiled against the real packages, so a rename
    # breaks the docs the same way it breaks the code. --min is a ratchet: it
    # only stops coverage falling, and is raised as packages get documented.
    - name: Typecheck Doc Examples
      run: |
        bun run check:docs
        bun run check:docs:coverage

    - name: Build Docs Site
      run: bun run docs:build

    - name: Upload Build Artifacts
      if: ${{ !startsWith(github.ref, 'refs/heads/dev/') }}
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          backend/dist
          admin-ui/dist
        retention-days: 7
