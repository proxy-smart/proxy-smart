name: Publish FHIR IG package

# Publishes the typed package for this repo's Consent IG (fhir/, maxhealth.consent) as
# @proxy-smart/consent-fhir, built and versioned by @max-health-inc/ig-tools like the org's other
# own-IG packages. The scope is @proxy-smart because GitHub Packages only accepts the owning org's scope.

on:
  push:
    branches: [main]
    paths:
      - 'fhir/**'
      - 'package.json'
      - '.github/workflows/publish-ig.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PKG_NAME: "@proxy-smart/consent-fhir"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-version

      - name: Install dependencies
        timeout-minutes: 20
        uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Resolved once, so the build and its babelfhir-<version> tag name the same release.
      # @babelfhir-ts/codegen and its parity history are private in another org, hence GH_PACKAGES_TOKEN.
      - name: Resolve the generator
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          npm config set @babelfhir-ts:registry https://npm.pkg.github.com --location=user
          echo "BABELFHIR_VERSION=$(./node_modules/.bin/resolve-babelfhir --explain)" >> "$GITHUB_ENV"

      - name: Decide the release (ig-tools release-plan)
        id: decide
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          FSH_HASH=$(find fhir/input fhir/sushi-config.yaml -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          KEY="fsh:${FSH_HASH}|babelfhir@${BABELFHIR_VERSION}|no-client"
          # tr -d '\r': .gitattributes forces CRLF on *.yaml.
          IG_VERSION=$(grep -E '^version:' fhir/sushi-config.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          echo "ig_version=$IG_VERSION" >> "$GITHUB_OUTPUT"
          ./node_modules/.bin/release-plan --package "$PKG_NAME" --ig-version "$IG_VERSION" \
            --build-key "$KEY" --generator "$BABELFHIR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile FSH (SUSHI) + generate typed package
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          IG_VERSION: ${{ steps.decide.outputs.ig_version }}
        run: |
          node fhir/build.mjs
          rm -rf dist-ig && mkdir dist-ig
          tar xzf "lib/maxhealth.consent-${IG_VERSION}-generated.tgz" -C dist-ig --strip-components=1

      # Runs before the stamp so a package that does not build never reaches `npm publish`.
      - name: Typecheck the generated package
        if: steps.decide.outputs.publish == 'true'
        uses: babelfhir-ts/.github/typecheck-generated@aae253a3dbe9f7ff491b5e89e6913f649dc6d78e
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        with:
          path: dist-ig

      - name: Stamp name / version
        if: steps.decide.outputs.publish == 'true'
        run: |
          node -e "const fs=require('fs'),f='dist-ig/package.json',p=JSON.parse(fs.readFileSync(f));p.name='${{ env.PKG_NAME }}';p.version='${{ steps.decide.outputs.version }}';p.publishConfig={registry:'https://npm.pkg.github.com'};p.repository={type:'git',url:'${{ github.server_url }}/${{ github.repository }}.git'};fs.writeFileSync(f,JSON.stringify(p,null,2))"

      - name: Publish to GitHub Packages
        if: steps.decide.outputs.publish == 'true'
        working-directory: dist-ig
        run: npm publish --tag "${{ steps.decide.outputs.latest == 'true' && 'latest' || format('ig-{0}', steps.decide.outputs.ig_version) }}"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Tag the build (build key, IG version, generator)
        if: steps.decide.outputs.publish == 'true'
        working-directory: dist-ig
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          for tag in ${{ steps.decide.outputs.tags }}; do
            npm dist-tag add "$PKG_NAME@${{ steps.decide.outputs.version }}" "$tag"
          done
