name: Create GitHub Release

on:
  workflow_call:
    inputs:
      release_type:
        description: "Type of release (alpha, beta, production)"
        required: true
        type: string
      version:
        description: "Version number for this release"
        required: true
        type: string
      changelog:
        description: "Changelog content for the release"
        required: true
        type: string
      source_branch:
        description: "Source branch for the release"
        required: true
        type: string
      is_prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: false
      build_number:
        description: "Build number (for non-production releases)"
        required: false
        type: string
      short_sha:
        description: "Short commit SHA (for non-production releases)"
        required: false
        type: string
    secrets:
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

    outputs:
      release_url:
        description: "The URL of the created release"
        value: ${{ jobs.create-release.outputs.release_url }}
      tag_name:
        description: "The name of the created tag"
        value: ${{ jobs.create-release.outputs.tag_name }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.create-release.outputs.url }}
      tag_name: ${{ steps.create-release.outputs.tag_name }}
    
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create and push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG_NAME="v${VERSION}"

          if git tag -l "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "⚠️ Tag $TAG_NAME already exists locally"
          elif git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "⚠️ Tag $TAG_NAME already exists on remote"
          else
            echo "✅ Creating new tag: $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Create GitHub Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SHORT_SHA: ${{ inputs.short_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$RELEASE_TYPE" in
            "alpha")
              TITLE_SUFFIX=" (Alpha)"
              WARNING="⚠️ **This is an alpha release** - Use with caution in development environments only."
              ;;
            "beta")
              TITLE_SUFFIX=" (Beta)"
              WARNING="🧪 **This is a beta release** - Suitable for testing and staging environments."
              ;;
            "production"|"RELEASE")
              TITLE_SUFFIX=""
              WARNING=""
              ;;
            *)
              TITLE_SUFFIX=""
              WARNING="**Release Type:** ${RELEASE_TYPE}"
              ;;
          esac

          {
            printf '# Proxy Smart v%s%s\n\n%s\n' "$VERSION" "$TITLE_SUFFIX" "$WARNING"
            if [[ "$RELEASE_TYPE" != "production" && "$RELEASE_TYPE" != "RELEASE" ]]; then
              printf '\n**Build Info:**\n- Build Number: %s\n- Commit: %s\n- Built from: `%s`\n' "$BUILD_NUMBER" "$SHORT_SHA" "$SOURCE_BRANCH"
            fi
            printf '\n%s\n' "$CHANGELOG"
            printf '\n## Installation\n```bash\ngit clone https://github.com/%s.git\ncd proxy-smart\ngit checkout v%s\n```\n\nSee the [README](README.md) for setup instructions.\n' "$REPOSITORY" "$VERSION"
          } > release-notes.md

          EXTRA_ARGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi

          TAG_NAME="v${VERSION}"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "⚠️ Release $TAG_NAME already exists, updating..."
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              $EXTRA_ARGS
          fi

          RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/$TAG_NAME"
          
          echo "Created release: $RELEASE_URL"
          echo "url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
