name: Publish packages

# Publishes every non-private workspace; versions already on the registry are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-version

      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      # The API client is generated and gitignored.
      - name: Generate and build clients
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          pip install --break-system-packages openapi-ts-fetch==0.3.0
          cd backend && bun run export-openapi && cd ..
          bun run generate:clients

      # Version from the release tag on HEAD, falling back to each manifest.
      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail
          # On main, a RELEASE tag wins over a prerelease tag on the same commit.
          TAGS=$(git tag --points-at HEAD --sort=-creatordate | grep -E '^v[0-9]' || true)
          TAG=$(grep -- '-RELEASE\.' <<< "$TAGS" | head -1 || true)
          [ -n "$TAG" ] || TAG=$(head -1 <<< "$TAGS")
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Release version ${TAG#v} (from tag $TAG)"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No release tag on this commit - using each manifest's own version"
          fi

      # Publish with github.token (the PAT 401s on PUT); GH_PACKAGES_TOKEN only reads other repos' packages via .npmrc.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          OWNER_SCOPE: '@${{ github.repository_owner }}'
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_SCOPE=$(echo "$OWNER_SCOPE" | tr '[:upper:]' '[:lower:]')
          PUBLISHED=0 SKIPPED=0 MISMATCHED=0

          for dir in $(node -p "require('./package.json').workspaces.map((w) => w + '/').join(' ')"); do
            [ -f "${dir}package.json" ] || continue
            PRIVATE=$(node -p "require('./${dir}package.json').private === true")
            [ "$PRIVATE" = "false" ] || continue

            NAME=$(node -p "require('./${dir}package.json').name")
            MANIFEST_VERSION=$(node -p "require('./${dir}package.json').version")
            POLICY=$(node -p "require('./${dir}package.json').versionPolicy ?? ''")
            if [ "$POLICY" = "independent" ]; then VERSION="$MANIFEST_VERSION"; else VERSION="${RELEASE_VERSION:-$MANIFEST_VERSION}"; fi
            SCOPE="${NAME%%/*}"

            if [ "$SCOPE" != "$OWNER_SCOPE" ]; then
              echo "- \`$NAME\` skipped: scope \`$SCOPE\` is not \`$OWNER_SCOPE\`, which GitHub Packages requires." >> "$GITHUB_STEP_SUMMARY"
              MISMATCHED=$((MISMATCHED+1))
              continue
            fi

            FOUND=$(.github/scripts/npm-registry-version.sh "$NAME@$VERSION")
            if [ -n "$FOUND" ]; then
              echo "- \`$NAME@$VERSION\` already published." >> "$GITHUB_STEP_SUMMARY"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            # `npm pkg set`, not `npm version`, which reifies workspace:* deps and fails EUNSUPPORTEDPROTOCOL.
            echo "Publishing $NAME@$VERSION"
            (cd "$dir" && npm pkg set version="$VERSION" && npm publish)
            echo "- \`$NAME@$VERSION\` published." >> "$GITHUB_STEP_SUMMARY"
            PUBLISHED=$((PUBLISHED+1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLISHED published, $SKIPPED already current, $MISMATCHED skipped on scope." >> "$GITHUB_STEP_SUMMARY"
