name: Alpha Release

on:
  push:
    branches: [develop]
    paths-ignore:
      - '.github/workflows/deploy-beta.yml'
      - '.github/scripts/deploy-beta-remote.sh'
      - 'docker-compose.beta.yml'
      - 'docker-compose.postgres.yml'
      - 'docker-compose.caddy.yml'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  # Propagates down orchestrator -> build-and-test so bun can install
  # @max-health-inc/shared-ui from GitHub Packages. (release-beta already grants this.)
  packages: read

concurrency:
  group: releases-alpha
  cancel-in-progress: false

jobs:
  alpha-release:
    name: Alpha Release
    # Only run if the last commit is not a release commit to avoid infinite loops
    if: ${{ !contains(github.event.head_commit.message, '🔄 Update version') && !contains(github.event.head_commit.message, '🤖 Update client APIs') && !contains(github.event.head_commit.message, 'Alpha release') && !contains(github.event.head_commit.message, '🚀') && !contains(github.event.head_commit.message, 'proxy-smart-releaser') }}
    uses: ./.github/workflows/release-orchestrator.yml
    with:
      release_type: 'alpha'
      source_branch: 'develop'
      target_branch: 'develop'
      should_bump_version: true
      is_prerelease: true
    secrets: inherit

  # Note: Alpha is a development-only release. No live deployment.
  # The release-orchestrator bumps the version and creates a GitHub prerelease tag.
