name: 'Build Admin UI'
description: 'Put the admin UI into webapp-dist/: the release pinned in .github/admin-ui.json, or a build of a branch against this commit''s API client'

# The caller checks out proxy-smart, sets up bun and installs the workspace first.

inputs:
  source:
    description: '`package`: install the @proxy-smart/admin-ui release pinned in .github/admin-ui.json. `build`: check out a branch and build it.'
    required: false
    default: build
  app_id:
    description: 'GitHub App client id that can read the private admin UI repository (build only)'
    required: false
    default: ''
  app_private_key:
    description: 'GitHub App private key (build only)'
    required: false
    default: ''
  packages_token:
    description: 'GitHub Packages token: the workspace install, and reading the private admin UI package'
    required: true
  base:
    description: 'VITE_BASE, the path the UI is served under (build only; a release is built for /webapp/)'
    required: false
    default: '/webapp/'
  ref:
    description: 'Admin UI ref to build. Empty: the branch named like this run''s, else main (build only)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Refuse an unknown source
      if: inputs.source != 'build' && inputs.source != 'package'
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        echo "::error::source must be build or package, got '${SOURCE}'"
        exit 1

    # GITHUB_TOKEN is scoped to the running repository and cannot read another private one.
    - name: Authenticate as GitHub App for the admin UI
      if: inputs.source == 'build'
      id: ui-app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: proxy-smart
        repositories: proxy-smart-admin-ui

    - name: Resolve admin UI ref
      if: inputs.source == 'build'
      id: ui-ref
      uses: ./.github/actions/admin-ui-ref
      with:
        token: ${{ steps.ui-app-token.outputs.token }}
        ref: ${{ inputs.ref }}

    - name: Checkout admin UI
      if: inputs.source == 'build'
      uses: actions/checkout@v6
      with:
        repository: proxy-smart/proxy-smart-admin-ui
        ref: ${{ steps.ui-ref.outputs.ref }}
        path: admin-ui
        token: ${{ steps.ui-app-token.outputs.token }}

    # The repository's .npmrc maps @proxy-smart to GitHub Packages and reads GH_PACKAGES_TOKEN.
    - name: Fetch the pinned admin UI release
      if: inputs.source == 'package'
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.packages_token }}
      run: |
        set -euo pipefail
        VERSION=$(jq -er '.version' .github/admin-ui.json)
        STAGE=$(mktemp -d)
        TARBALL=$(npm pack "@proxy-smart/admin-ui@${VERSION}" --pack-destination "$STAGE" --silent)
        rm -rf admin-ui
        mkdir admin-ui
        tar -xzf "$STAGE/$TARBALL" -C admin-ui --strip-components=1
        echo "Admin UI ${VERSION} from the package registry" >> "$GITHUB_STEP_SUMMARY"

    - name: Install OpenAPI generator
      if: inputs.source == 'build'
      shell: bash
      run: pip install --break-system-packages openapi-ts-fetch==0.3.1

    # The UI declares the API it supports as proxySmart.apiCompat. api-client versions carry a
    # -<channel>.<timestamp>.<sha> suffix that is build metadata, so only the release core is compared.
    - name: Check the admin UI supports this API version
      shell: bash
      run: |
        bun -e '
          const ui = await Bun.file("admin-ui/package.json").json();
          const client = await Bun.file("packages/api-client/package.json").json();
          const range = ui.proxySmart?.apiCompat;

          if (!range) {
            console.error("::error::admin-ui/package.json declares no proxySmart.apiCompat, so nothing says which API versions it supports.");
            process.exit(1);
          }

          const core = (client.version.match(/^\d+\.\d+\.\d+/) ?? [])[0];
          if (!core) {
            console.error(`::error::Cannot read a release version out of api-client ${client.version}.`);
            process.exit(1);
          }
          if (!Bun.semver.satisfies(core, range)) {
            console.error(`::error::Admin UI ${ui.version} supports @proxy-smart/api-client ${range}, but this commit produced ${client.version}. Update the UI for the API change, then widen proxySmart.apiCompat in proxy-smart-admin-ui.`);
            process.exit(1);
          }
          console.log(`Admin UI ${ui.version} supports ${range}; this commit produced ${client.version}.`);
        '

    # Linked by path, so a branch build cannot use an API revision this commit did not produce.
    - name: Build admin UI
      if: inputs.source == 'build'
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.packages_token }}
        TAILWIND_DISABLE_LIGHTNINGCSS: "1"
        VITE_BASE: ${{ inputs.base }}
      run: |
        bun run generate:ui
        cd admin-ui
        bun add "@proxy-smart/api-client@file:../packages/api-client"
        bun run build --outDir ../webapp-dist --emptyOutDir
        echo "Admin UI built: $(find ../webapp-dist -type f | wc -l) files"

    - name: Stage the released admin UI
      if: inputs.source == 'package'
      shell: bash
      run: |
        rm -rf webapp-dist
        cp -r admin-ui/dist webapp-dist
        echo "Admin UI staged: $(find webapp-dist -type f | wc -l) files"
