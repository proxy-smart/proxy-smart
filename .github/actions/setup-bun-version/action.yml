name: 'Setup Bun with Version Scripts'
description: 'Checkout code, setup Node.js and Bun with caching, and prepare version management'

inputs:
  node-version:
    description: 'Node.js version to setup'
    required: false
    default: '22'
  bun-version:
    description: 'Bun version to setup (default: packageManager in package.json)'
    required: false
    default: ''
  fetch-depth:
    description: 'Checkout fetch depth'
    required: false
    default: '0'
  checkout:
    description: 'Whether to checkout code'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for checkout'
    required: false
    default: ${{ github.token }}
  ref:
    description: 'Branch or ref to checkout'
    required: false

runs:
  using: 'composite'
  steps:
  - name: Checkout code
    if: inputs.checkout == 'true'
    uses: actions/checkout@v6
    with:
      fetch-depth: ${{ inputs.fetch-depth }}
      token: ${{ inputs.token }}
      ref: ${{ inputs.ref }}

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: ${{ inputs.node-version }}

  - name: Resolve Bun version
    id: bun
    shell: bash
    env:
      REQUESTED: ${{ inputs.bun-version }}
    run: |
      version="${REQUESTED:-$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")}"
      echo "version=$version" >> "$GITHUB_OUTPUT"

  - name: Cache Bun binary
    id: cache-bun
    uses: actions/cache@v5
    with:
      path: ~/.bun
      key: ${{ runner.os }}-bun-binary-${{ steps.bun.outputs.version }}
      restore-keys: |
        ${{ runner.os }}-bun-binary-

  - name: Setup Bun
    uses: oven-sh/setup-bun@v2
    with:
      bun-version: ${{ steps.bun.outputs.version }}

  - name: Cache Bun dependencies
    uses: actions/cache@v5
    with:
      # Cache ONLY bun's content-addressable global tarball/bunx caches, never the
      # project node_modules. Caching node_modules is fragile with bun's isolated
      # linker: restoring a stale node_modules across a lockfile change (e.g. the
      # shared-ui github:->registry migration, or an unpublished pinned version)
      # wedges `bun install`. node_modules is cheap to relink from the global cache.
      # The v2 key abandons the previously poisoned cache lineage.
      path: |
        ~/.bun/install/cache
        ~/.cache/bunx
        ~/.local/share/bunx
      key: ${{ runner.os }}-bun-cache-v2-${{ hashFiles('**/bun.lock') }}
      restore-keys: |
        ${{ runner.os }}-bun-cache-v2-
