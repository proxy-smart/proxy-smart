# Postgres shared by every stack through `extends`. Each stack sets POSTGRES_PASSWORD
# and its own container name; copy this file next to any stack you deploy.

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keycloak/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - proxy-smart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy-smart:

volumes:
  postgres_data:
