services:
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: proxy-smart-keycloak-prod
    environment:
      # Backend origin, substituted into the login theme's proxy-context script src
      # (keycloak/themes/proxy-smart/login/theme.properties). Keycloak does not read it.
      PROXY_PUBLIC_URL: http://localhost:8445
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_PROXY: edge
      KC_CACHE: ispn
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      # Cap the Keycloak DB pool (default 100) so it cannot alone exhaust the
      # shared Postgres connection budget under load.
      KC_DB_POOL_MAX_SIZE: "30"
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    volumes:
      # Dockerfile.keycloak ships no realm on purpose, so supply your own here.
      # Required: without it Keycloak starts with no realm at all, which is a
      # loud failure rather than a silent boot on someone else's configuration.
      # Start from keycloak/realm-export.json, then remove the seeded admin,
      # doctor and testuser accounts and set your own admin-service secret —
      # every value in that file is published in this repository.
      - ${KEYCLOAK_REALM_FILE:?Set KEYCLOAK_REALM_FILE to your realm-export.json}:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-smart

  postgres:
    image: postgres:16-alpine
    container_name: proxy-smart-postgres-prod
    # Raise the connection ceiling above the default 100; the per-service pool
    # caps keep actual usage far below it (see "sorry, too many clients already").
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keycloak/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - proxy-smart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: proxy-smart-backend
    environment:
      NODE_ENV: production
      PORT: 8445
      BASE_URL: http://localhost:8445
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_DOMAIN: localhost
      KEYCLOAK_REALM: proxy-smart
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/proxy-smart/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: admin-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      FHIR_SERVER_BASE: https://hapi.fhir.org/baseR4,https://server.fire.ly # Multiple FHIR servers can be specified, separated by commas
    ports:
      - "8445:8445"
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      - keycloak
    networks:
      - proxy-smart

networks:
  proxy-smart:
    name: proxy-smart-network
    driver: bridge

volumes:
  postgres_data:
  backend_data:
