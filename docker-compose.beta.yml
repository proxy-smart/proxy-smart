# Beta deployment stack for OVH VPS (135.125.205.225)
# Domain: beta.proxy-smart.com
# Requires the shared Caddy proxy: docker-compose.caddy.yml
#
# Images are pre-built on GitHub Actions and pushed to GHCR.
# The VPS only pulls images — no Docker builds happen here.
#
# Image env vars (set in .env.beta by CI):
#   BACKEND_IMAGE, KEYCLOAK_IMAGE
#
# Prerequisites:
#   docker network create caddy
#   docker compose -f docker-compose.caddy.yml up -d
#
# Usage:
#   docker compose -f docker-compose.beta.yml --env-file .env.beta up -d
#
# Required env vars (set in .env.beta):
#   KC_DB_PASSWORD, POSTGRES_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#   KEYCLOAK_ADMIN_CLIENT_SECRET, VITE_ENCRYPTION_SECRET,
#   SHL_EXCHANGE_CLIENT_SECRET (required — the backend reconciles Keycloak's
#     shl-exchange client to this value at startup)

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/proxy-smart/proxy-smart/keycloak:beta-latest}
    container_name: proxy-smart-keycloak-beta
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # Backend origin, substituted into the login theme's brand-accent script src
      # (keycloak/themes/proxy-smart/login/theme.properties). Keycloak does not read it.
      PROXY_PUBLIC_URL: https://beta.proxy-smart.com
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      KC_HOSTNAME: https://beta.proxy-smart.com/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      # Cap the Keycloak DB pool (default 100 would alone exhaust the shared
      # Postgres). 30 is ample for this single-instance deployment.
      KC_DB_POOL_MAX_SIZE: "30"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    labels:
      caddy: beta.proxy-smart.com
      # Only expose browser-interactive Keycloak endpoints.
      # Token, introspection, and userinfo MUST go through the proxy (/auth/token).
      # NOTE: Caddy path matcher * only matches a single segment (no slashes).
      # There is NO ** glob-star support. Use explicit depth levels for broker paths:
      #   /broker/* = /broker/alias, /broker/*/* = /broker/alias/login|endpoint
      #   /device, /device/* = RFC 8628 device-flow verification page (CLI login)
      caddy.@keycloak.path: "/auth/realms/proxy-smart/protocol/openid-connect/auth /auth/realms/proxy-smart/protocol/openid-connect/logout /auth/realms/proxy-smart/protocol/openid-connect/certs /auth/realms/proxy-smart/broker/* /auth/realms/proxy-smart/broker/*/* /auth/realms/proxy-smart/login-actions/* /auth/realms/proxy-smart/device /auth/realms/proxy-smart/device/* /auth/realms/proxy-smart/.well-known/* /auth/resources/* /auth/js/*"
      caddy.0_reverse_proxy: "@keycloak {{upstreams 8080}}"
      caddy.0_reverse_proxy.health_uri: /auth/health/ready
      caddy.0_reverse_proxy.health_port: 9000
      caddy.0_reverse_proxy.health_interval: 15s
      caddy.0_reverse_proxy.health_timeout: 5s
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-smart
      - caddy

  postgres:
    image: postgres:16-alpine
    container_name: proxy-smart-postgres-beta
    restart: unless-stopped
    mem_limit: 512m
    # One Postgres serves four DBs (keycloak, hapi, orthanc, proxy_smart). The
    # default max_connections=100 is exhausted under concurrent load (Inferno's
    # OAuth storm + FHIR reads) once Keycloak's pool ramps up, surfacing as
    # "sorry, too many clients already". Raise the ceiling; the per-service pool
    # caps below keep actual usage well under it.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keycloak/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - proxy-smart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/proxy-smart/proxy-smart/backend:beta-latest}
    container_name: proxy-smart-backend-beta
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      NODE_ENV: production
      PORT: 8445
      BASE_URL: https://beta.proxy-smart.com
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: https://beta.proxy-smart.com/auth
      KEYCLOAK_DOMAIN: beta.proxy-smart.com
      KEYCLOAK_REALM: proxy-smart
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/proxy-smart/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: admin-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Shared admin-config store (MCP endpoint + app-store visibility) and mTLS
      # store. Backed by the proxy_smart DB on the shared postgres service (created
      # by keycloak/database/init.sql). Without this, those configs fall back to
      # ephemeral, per-task container files and diverge under scale-out / restart.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/proxy_smart
      SHL_EXCHANGE_CLIENT_ID: shl-exchange
      # No public default — a missing secret must fail loudly, not silently
      # authenticate with a known value. The backend reconciles Keycloak's
      # shl-exchange client to this at startup (ensureShlExchangeClient).
      SHL_EXCHANGE_CLIENT_SECRET: ${SHL_EXCHANGE_CLIENT_SECRET:?Set SHL_EXCHANGE_CLIENT_SECRET}
      FHIR_SERVER_BASE: http://hapi-fhir:8080/fhir
      CORS_ORIGINS: https://beta.proxy-smart.com,http://localhost:4567
      DICOMWEB_BASE_URL: http://orthanc:8042/dicom-web
      DICOMWEB_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      DICOMWEB_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PROXY_SIGNING_KEY_FILE: /run/secrets/proxy-signing-key.pem
      # ── Access control posture (explicit, not inherited defaults) ──────────
      # These four decide how much of the SMART access model is actually enforced.
      # They were previously unset in every environment, so beta and production ran
      # identical implicit defaults. Set to today's effective values: changing the
      # posture is now a reviewable one-line edit.
      #   scope enforcement : enforce | audit-only | disabled
      #   role filtering    : enforce narrows patient/-scoped grants to the token's
      #                       `patient` context and refuses one without a context;
      #                       audit-only logs what enforce would change
      SCOPE_ENFORCEMENT_MODE: ${SCOPE_ENFORCEMENT_MODE:-enforce}
      ROLE_BASED_FILTERING_MODE: ${ROLE_BASED_FILTERING_MODE:-audit-only}
      CONSENT_ENABLED: ${CONSENT_ENABLED:-false}
      CONSENT_MODE: ${CONSENT_MODE:-audit-only}
    volumes:
      - ${PROXY_SIGNING_KEY_PATH:-./proxy-signing-key.pem}:/run/secrets/proxy-signing-key.pem:ro
      - backend_data:/app/backend/data
      - apps_static:/app/backend/public/apps
    labels:
      caddy: beta.proxy-smart.com
      caddy.header: X-Robots-Tag "noindex, nofollow"
      caddy.@backend.path: "/ /.well-known/* /health /status /auth/authorize /auth/token /auth/introspect /auth/userinfo /auth/config /auth/jwks.json /auth/login /auth/login-brand.css /auth/logout /auth/launch /auth/register /auth/smart-callback /auth/patient-select /auth/patient-search /auth/identity-providers /auth/.well-known/* /auth/oauth-protected-resource /auth/oauth-protected-resource/* /auth/oauth-authorization-server /auth/oauth-authorization-server/* /auth/openid-configuration /auth/openid-configuration/* /admin/* /api/* /monitoring/* /oauth/* /consent/* /fhir-servers /fhir-servers/* /dicomweb/* /docs /docs/* /docs/*/* /docs-api /docs-api/* /mcp /mcp/* /proxy-smart-backend/* /patient-picker /patient-picker/* /patient-picker/*/* /apps /apps/* /apps/*/* /apps/*/*/* /apps/*/*/*/* /apps.json /swagger /swagger/* /openapi /openapi/* /openapi.json /proxy-smart.svg /webapp /webapp/* /webapp/*/*"
      caddy.1_reverse_proxy: "@backend {{upstreams 8445}}"
      caddy.1_reverse_proxy.health_uri: /health
      caddy.1_reverse_proxy.health_interval: 10s
      caddy.1_reverse_proxy.health_timeout: 5s
      # Catch-all: any path not matched above → backend handles it (serves styled 404)
      caddy.2_reverse_proxy: "{{upstreams 8445}}"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8445/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - proxy-smart
      - caddy

  hapi-fhir:
    image: hapiproject/hapi:v8.6.5-1
    container_name: proxy-smart-hapi-fhir-beta
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC"
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi
      spring.datasource.username: postgres
      spring.datasource.password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      spring.datasource.driverClassName: org.postgresql.Driver
      # Bound HAPI's Hikari pool explicitly (default 10) so the shared-Postgres
      # connection budget stays deterministic under concurrent FHIR load.
      spring.datasource.hikari.maximum-pool-size: "15"
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.cors.allow_Credentials: "true"
      hapi.fhir.cors.allowed_origin: "https://beta.proxy-smart.com"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/fhir/metadata > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-smart

  orthanc:
    image: orthancteam/orthanc:26.1.0
    container_name: proxy-smart-orthanc-beta
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ORTHANC__NAME: "Proxy Smart PACS"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-orthanc}": "${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD}"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__HOST: "postgres"
      ORTHANC__POSTGRESQL__PORT: 5432
      ORTHANC__POSTGRESQL__DATABASE: "orthanc"
      ORTHANC__POSTGRESQL__USERNAME: "postgres"
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-smart

networks:
  proxy-smart:
    name: proxy-smart-beta-network
    driver: bridge
  caddy:
    external: true

volumes:
  postgres_data:
  orthanc_data:
  backend_data:
  apps_static:
